[env:esp32dev]
board = esp32dev
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.partitions = huge_app.csv
build_flags =
    -Os
    -fno-exceptions
    -fno-rtti
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    -ffunction-sections
    -fdata-sections
    -DNDEBUG
    -UDEBUG
    -UFASTLED_DEBUG
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
build_unflags = -Og -g
monitor_filters =
    default
    esp32_exception_decoder
lib_ldf_mode = chain
lib_archive = true
